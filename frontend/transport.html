<!doctype html><html><head><meta charset="utf-8"/><title>Transport — VoyGo</title><link rel="stylesheet" href="css/styles.css"/><script src="js/main.js" defer></script><script src="js/search.js" defer></script><script src="js/bookings.js" defer></script></head>
<body>
<div class="container">
  <header class="header">
  <a class="brand" href="index.html">
    <div class="logo">V</div>
    <div>
      <strong>VoyGo</strong>
      <div style="font-size:12px;color:var(--muted)">AI Travel & Budgeting</div>
    </div>
  </a>
  <nav class="nav"></nav>
</header>

  <div class="card">
    <h3>Book Cabs & Transport</h3>
    <form onsubmit="event.preventDefault(); tsearch()">
      <div class="form-row">
        <input class="input" name="city" id="tcity" placeholder="City" required>
        <input class="input" name="date" type="date" required>
      </div>
      <div style="margin-top:10px"><button class="btn">Search</button></div>
    </form>
    <div id="tresults" style="margin-top:12px"></div>
  </div>

<script>
async function tsearch(){
  const city = document.getElementById('tcity').value;
  document.getElementById('tresults').textContent = 'Searching...';
  const res = await fetch(`/api/search/transport?city=${encodeURIComponent(city)}`);
  const data = await res.json();
  document.getElementById('tresults').innerHTML = data.map(x => `<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><strong>${x.type}</strong><div style="color:var(--muted)">${x.provider}</div></div><div>₹${x.price}</div></div><div style="margin-top:8px"><button class="btn" onclick='bookTrans(${JSON.stringify(JSON.stringify(x))})'>Book</button></div></div>`).join('');
}
async function bookTrans(encoded){
  const x = JSON.parse(encoded);
  if(!getToken()){ showToast('Please login','error'); location='login.html'; return; }
  const res = await createBooking({type:'transport', item:x.provider + ' - ' + x.type, price:x.price, details:x});
  showToast(res.error ? res.error : 'Transport booked!');
  if(!res.error) location='dashboard.html';
}
</script>
</div></body></html>
