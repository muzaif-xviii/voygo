<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Profile — VoyGo</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/main.js" defer></script>
</head>
<body>
<div class="container">
  <header class="header">
  <a class="brand" href="index.html">
    <div class="logo">V</div>
    <div>
      <strong>VoyGo</strong>
      <div style="font-size:12px;color:var(--muted)">AI Travel & Budgeting</div>
    </div>
  </a>
  <nav class="nav"></nav>
</header>


  <div class="card" style="max-width:600px;margin:auto">
    <h2>Your Profile</h2>
    <div id="profile-content">Loading...</div>
  </div>
</div>

<script>
(async ()=>{
  const token = getToken();
  if(!token){
    document.getElementById('profile-content').innerHTML = 'Please <a href="login.html">login</a>.';
    return;
  }
  const user = JSON.parse(localStorage.getItem('voygo_user'));
  if(!user){ document.getElementById('profile-content').textContent = 'No user data'; return; }
  document.getElementById('profile-content').innerHTML = `
    <p><strong>Name:</strong> ${user.name}</p>
    <p><strong>Email:</strong> ${user.email}</p>
    <p><strong>Plan:</strong> ${user.premium ? 'Premium ✨' : 'Free'}</p>
    <div style="margin-top:16px">
      <button class="btn" onclick="alert('Edit profile coming soon!')">Edit Profile</button>
    </div>
  `;
})();
</script>
<script src="js/auth.js"></script>
<script>
  checkAuth(); // redirect to login if not logged in
</script>
</body>
</html>
