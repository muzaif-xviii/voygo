<!doctype html><html><head><meta charset="utf-8"/><title>Signup — VoyGo</title><link rel="stylesheet" href="css/styles.css"/><script src="js/auth.js" defer></script><script src="js/main.js" defer></script></head>
<body>
<div class="container">
  <header class="header"><a class="brand" href="index.html"><div class="logo">V</div><div><strong>VoyGo</strong></div></a></header>
  <div class="card" style="max-width:560px;margin:auto">
    <h2>Create account</h2>
    <form onsubmit="event.preventDefault(); signup(this)">
      <div class="form-row"><input class="input" name="name" placeholder="Full name" required></div>
      <div class="form-row" style="margin-top:8px"><input class="input" name="email" type="email" placeholder="Email" required></div>
      <div class="form-row" style="margin-top:8px"><input class="input" name="password" type="password" placeholder="Password" required></div>
      <div style="margin-top:12px"><button class="btn">Sign up</button> <a class="btn ghost" href="login.html">Have an account?</a></div>
    </form>
  </div>
</div>
</body></html>
